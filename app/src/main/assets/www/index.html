<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Alinas Kaufladen</title>
<style>
:root{
  --cream:#FFF8EC;
  --cream-2:#FFFDF8;
  --brown:#7A4E2D;
  --brown-dark:#4E3218;
  --red:#E8543E;
  --red-dark:#C63F2C;
  --green:#3F9463;
  --green-dark:#2C7A4E;
  --yellow:#F4B93E;
  --ink:#2B2320;
  --radius:22px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
h1,h2,h3,.display{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;}

.awning{
  height:26px;
  background:repeating-linear-gradient(115deg, var(--red) 0 34px, var(--cream-2) 34px 68px);
  border-bottom:4px solid var(--brown-dark);
}
.topbar{
  background:var(--brown);
  color:var(--cream-2);
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.topbar h1{
  margin:0;
  font-size:1.4rem;
  font-weight:800;
  letter-spacing:0.5px;
}
.topbar .right-slot{display:flex;gap:8px;}
.topbar button{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:700;
  font-size:1rem;
  background:var(--cream-2);
  color:var(--brown-dark);
  border:none;
  border-radius:14px;
  padding:10px 16px;
  cursor:pointer;
}
.topbar button:active{transform:scale(0.96);}

main{
  max-width:900px;
  margin:0 auto;
  padding:22px 16px 60px;
}

.home-grid{
  display:grid;
  gap:20px;
  margin-top:10px;
}
.big-btn{
  border:none;
  border-radius:28px;
  padding:34px 20px;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:800;
  font-size:1.6rem;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:18px;
  box-shadow:0 8px 0 rgba(0,0,0,0.15);
  transition:transform .08s;
}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,0.15);}
.big-btn .emoji{font-size:2.6rem;}
.btn-kasse{background:var(--red);}
.btn-produkte{background:var(--green);}
.home-sub{
  color:var(--brown-dark);
  font-size:1.05rem;
  margin-top:-6px;
  font-weight:600;
}

.card{
  background:var(--cream-2);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:0 3px 10px rgba(122,78,45,0.12);
  margin-bottom:18px;
}
.section-title{
  font-size:1.3rem;
  font-weight:800;
  margin:0 0 12px;
  color:var(--brown-dark);
}

.form-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.form-row input, .form-row select{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:1.05rem;
  padding:12px 14px;
  border:2px solid #E4D3BC;
  border-radius:14px;
  background:#fff;
  flex:1;
  min-width:110px;
}

.photo-picker{
  display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;
}
.photo-preview{
  width:64px;height:64px;border-radius:14px;
  background:#fff;border:2px solid #E4D3BC;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;overflow:hidden;flex-shrink:0;
}
.photo-preview img{width:100%;height:100%;object-fit:cover;}
.photo-btn{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;
  background:#fff;border:2px solid #E4D3BC;border-radius:14px;
  padding:10px 14px;cursor:pointer;font-size:0.95rem;
}
.photo-btn.remove{border-color:var(--red);color:var(--red-dark);}

.emoji-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.emoji-picker button{
  font-size:1.5rem;
  background:#fff;
  border:2px solid #E4D3BC;
  border-radius:12px;
  padding:6px 8px;
  cursor:pointer;
}
.emoji-picker button.selected{border-color:var(--yellow);background:#FFF2CE;}
.add-btn{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:700;
  font-size:1.1rem;
  background:var(--green);
  color:#fff;
  border:none;
  border-radius:14px;
  padding:12px 22px;
  cursor:pointer;
}
.add-btn:active{transform:scale(0.97);}

.product-list{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:14px;
}
.product-card{
  background:#fff;
  border:2px solid #F0E3CC;
  border-radius:16px;
  padding:12px;
  text-align:center;
  position:relative;
}
.product-card .emoji{font-size:2.2rem;}
.product-card .photo{width:56px;height:56px;border-radius:12px;object-fit:cover;}
.product-card .pname{font-weight:800;margin:4px 0 2px;font-size:1.02rem;}
.product-card .pprice{color:var(--red-dark);font-weight:800;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1.1rem;}
.product-card .pcode{font-size:0.8rem;color:#8A7458;margin-top:2px;}
.del-btn{
  position:absolute;top:6px;right:6px;
  background:var(--red);
  color:#fff;
  border:none;
  border-radius:50%;
  width:26px;height:26px;
  font-weight:800;
  cursor:pointer;
  line-height:1;
}
.print-btn{
  background:var(--yellow);
  color:var(--brown-dark);
  border:none;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:700;
  border-radius:14px;
  padding:10px 18px;
  cursor:pointer;
  margin-bottom:14px;
}

#reader{
  width:100%;
  max-width:340px;
  height:280px;
  margin:0 auto 14px;
  border-radius:18px;
  overflow:hidden;
  border:4px solid var(--brown);
  background:#000;
}
#reader video{width:100%;height:100%;object-fit:cover;display:block;}
.scan-btn{
  display:block;
  margin:0 auto 16px;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:800;
  font-size:1.2rem;
  background:var(--red);
  color:#fff;
  border:none;
  border-radius:16px;
  padding:14px 28px;
  cursor:pointer;
}
.scan-flash{
  text-align:center;
  font-weight:800;
  color:var(--green-dark);
  min-height:1.4em;
  margin-bottom:6px;
}
.manual-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(110px,1fr));
  gap:10px;
  margin-top:6px;
}
.manual-item{
  background:#fff;
  border:2px solid #F0E3CC;
  border-radius:14px;
  padding:10px 6px;
  text-align:center;
  cursor:pointer;
  font-weight:700;
}
.manual-item .emoji{font-size:1.8rem;display:block;}
.manual-item .photo{width:40px;height:40px;border-radius:10px;object-fit:cover;display:block;margin:0 auto 4px;}
.manual-item:active{background:#FFF2CE;}

.cart-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 0;
  border-bottom:1px dashed #E4D3BC;
}
.cart-row.liste-done{background:#E8F5E9;opacity:0.7;text-decoration:line-through;border-radius:10px;padding-left:6px;}
.cart-row .emoji{font-size:1.6rem;}
.cart-row .photo{width:34px;height:34px;border-radius:8px;object-fit:cover;}
.cart-row .name{flex:1;font-weight:700;}
.cart-row .qty{
  background:var(--cream);
  border-radius:10px;
  padding:2px 10px;
  font-weight:800;
}
.cart-row .line-total{font-weight:800;color:var(--red-dark);min-width:70px;text-align:right;}
.cart-row .rm{
  background:none;border:none;color:var(--brown);font-size:1.2rem;cursor:pointer;
}
.total-row{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:14px;margin-top:6px;border-top:3px solid var(--brown);
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;font-size:1.5rem;
}
.pay-btn{
  display:block;width:100%;margin-top:16px;
  background:var(--green);color:#fff;border:none;border-radius:16px;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;font-size:1.2rem;
  padding:14px;cursor:pointer;
}
.pay-btn:disabled{background:#C9BBA6;cursor:not-allowed;}
.empty-hint{color:#8A7458;font-weight:600;text-align:center;padding:20px 0;}

.modal-bg{
  position:fixed;inset:0;background:rgba(43,35,32,0.55);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
}
.modal{
  background:#fff;border-radius:24px;padding:26px;max-width:380px;width:100%;text-align:center;
}
.modal h2{margin-top:0;color:var(--brown-dark);}
.modal input{
  width:100%;font-size:1.4rem;text-align:center;padding:12px;border-radius:14px;
  border:2px solid #E4D3BC;margin:12px 0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
}
.change-display{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1.6rem;font-weight:800;
  color:var(--green-dark);margin:10px 0;
}
.modal-actions{display:flex;gap:10px;margin-top:14px;}
.modal-actions button{
  flex:1;border:none;border-radius:14px;padding:12px;font-weight:800;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;
}
.modal-actions .cancel{background:#EFE6D6;color:var(--brown-dark);}
.modal-actions .confirm{background:var(--green);color:#fff;}
</style>
</head>
<body>

<div class="awning"></div>
<div class="topbar">
  <h1 id="screenTitle">🏪 Alinas Kaufladen</h1>
  <div class="right-slot">
    <button id="settingsBtn" style="display:none;">⚙️</button>
    <button id="homeBtn" style="display:none;">🏠 Start</button>
  </div>
</div>

<main id="app"></main>

<script>
const EMOJI_CHOICES = ["🍎","🍌","🍊","🍇","🥕","🥦","🍞","🥛","🧀","🥚","🍫","🍪","🧃","🍅","🥔","🍕","🍦","🥫","🐟","🍗"];
const ADMIN_PIN = "2302";

let products = [];
let cards = [];
let cart = [];
let shoppingList = [];
let selectedEmoji = EMOJI_CHOICES[0];
let currentPhoto = null;
let totalRevenue = 0;
let scanner = null;
let scanVideo = null;
let scanStream = null;
let scanLoopActive = false;
let activeCode = null;
let lastSeenTime = 0;

const app = document.getElementById('app');
const screenTitle = document.getElementById('screenTitle');
const homeBtn = document.getElementById('homeBtn');
const settingsBtn = document.getElementById('settingsBtn');

homeBtn.addEventListener('click', () => goHome());
settingsBtn.addEventListener('click', () => openPinPrompt());

function beep(freq=880, dur=0.12){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }catch(e){}
}

async function loadProducts(){
  try{
    const raw = localStorage.getItem('km_products');
    products = raw ? JSON.parse(raw) : [];
  }catch(e){ products = []; }
}
async function saveProducts(){
  try{ localStorage.setItem('km_products', JSON.stringify(products)); }
  catch(e){ console.error('Speichern fehlgeschlagen', e); }
}

async function loadCards(){
  try{
    const raw = localStorage.getItem('km_cards');
    cards = raw ? JSON.parse(raw) : [];
  }catch(e){ cards = []; }
}
async function saveCards(){
  try{ localStorage.setItem('km_cards', JSON.stringify(cards)); }
  catch(e){ console.error('Speichern fehlgeschlagen', e); }
}

async function loadRevenue(){
  try{ totalRevenue = parseFloat(localStorage.getItem('km_revenue')) || 0; }
  catch(e){ totalRevenue = 0; }
}
async function saveRevenue(){
  try{ localStorage.setItem('km_revenue', String(totalRevenue)); }
  catch(e){ console.error('Speichern fehlgeschlagen', e); }
}

function resizeImageFile(file, maxSize=220, quality=0.7){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxSize){ h = Math.round(h * (maxSize/w)); w = maxSize; }
        else if(h > maxSize){ w = Math.round(w * (maxSize/h)); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function stopScanner(){
  scanLoopActive = false;
  if(scanStream){
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
  scanVideo = null;
  activeCode = null;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function getCartTotal(){
  return cart.reduce((sum, c) => sum + c.price * c.qty, 0);
}

/* ---------- HOME ---------- */
async function goHome(){
  await stopScanner();
  screenTitle.textContent = "🏪 Alinas Kaufladen";
  homeBtn.style.display = 'none';
  settingsBtn.style.display = 'inline-block';
  app.innerHTML = `
    <div class="home-grid">
      <p class="home-sub">Was möchtest du machen?</p>
      <button class="big-btn btn-produkte" id="goListe"><span class="emoji">🛒</span> Einkaufsliste</button>
      <button class="big-btn btn-kasse" id="goKasseBtn"><span class="emoji">🧾</span> Kasse</button>
    </div>
  `;
  document.getElementById('goListe').addEventListener('click', renderListe);
  document.getElementById('goKasseBtn').addEventListener('click', renderKasse);
}

/* ---------- PIN / VERWALTUNG ---------- */
function openPinPrompt(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h2>🔒 Eltern-Bereich</h2>
      <p>Bitte PIN eingeben:</p>
      <input type="password" inputmode="numeric" maxlength="4" id="pinInput" placeholder="PIN">
      <div class="modal-actions">
        <button class="cancel" id="pinCancel">Abbrechen</button>
        <button class="confirm" id="pinOk">OK</button>
      </div>
    </div>
  `;
  document.body.appendChild(bg);
  const input = document.getElementById('pinInput');
  input.focus();
  document.getElementById('pinCancel').addEventListener('click', () => bg.remove());
  const tryPin = () => {
    if(input.value === ADMIN_PIN){
      bg.remove();
      renderVerwaltung();
    }else{
      input.value = '';
      input.placeholder = 'Falsch, nochmal!';
    }
  };
  document.getElementById('pinOk').addEventListener('click', tryPin);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryPin(); });
}

function renderVerwaltung(){
  screenTitle.textContent = "⚙️ Verwaltung";
  homeBtn.style.display = 'inline-block';
  settingsBtn.style.display = 'none';
  currentPhoto = null;
  app.innerHTML = `
    <div class="card">
      <h3 class="section-title">Neues Produkt</h3>
      <div class="photo-picker">
        <div class="photo-preview" id="photoPreview">${selectedEmoji}</div>
        <button class="photo-btn" id="takePhotoBtn">📷 Foto aufnehmen/wählen</button>
        <button class="photo-btn remove" id="removePhotoBtn" style="display:none;">Foto entfernen</button>
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none;">
      </div>
      <p class="home-sub" style="font-size:0.9rem;margin:-4px 0 10px;">Oder wähle stattdessen ein Emoji:</p>
      <div class="emoji-picker" id="emojiPicker"></div>
      <div class="form-row">
        <input id="pname" type="text" placeholder="Name (z.B. Apfel)">
        <input id="pprice" type="number" step="0.01" min="0" placeholder="Preis in €">
        <input id="pcode" type="text" placeholder="QR-Nummer (z.B. 123)">
      </div>
      <button class="add-btn" id="addProduct">➕ Hinzufügen</button>
    </div>

    <div class="card">
      <h3 class="section-title">Produkte (${products.length})</h3>
      <div class="product-list" id="productList"></div>
    </div>

    <div class="card">
      <h3 class="section-title">Bankkarte anlegen / aufladen</h3>
      <div class="form-row">
        <input id="cardCode" type="text" placeholder="Karten-QR-Nummer (z.B. 900)">
        <input id="cardAmount" type="number" step="0.01" min="0" placeholder="Aufladebetrag in €">
      </div>
      <button class="add-btn" id="addCard">💳 Anlegen / Aufladen</button>
    </div>

    <div class="card">
      <h3 class="section-title">Bankkarten (${cards.length})</h3>
      <div id="cardList"></div>
    </div>

    <div class="card">
      <h3 class="section-title">📊 Kassenbericht</h3>
      <div class="total-row" style="border-top:none;padding-top:0;">
        <span>Gesamteinnahmen</span>
        <span id="revenueDisplay">${totalRevenue.toFixed(2).replace('.', ',')} €</span>
      </div>
      <button class="photo-btn remove" id="resetRevenue" style="margin-top:10px;">Zurücksetzen</button>
    </div>
  `;

  const picker = document.getElementById('emojiPicker');
  EMOJI_CHOICES.forEach(em => {
    const b = document.createElement('button');
    b.textContent = em;
    if(em === selectedEmoji) b.classList.add('selected');
    b.addEventListener('click', () => {
      selectedEmoji = em;
      picker.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      if(!currentPhoto){ document.getElementById('photoPreview').innerHTML = em; }
    });
    picker.appendChild(b);
  });

  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  const removePhotoBtn = document.getElementById('removePhotoBtn');

  document.getElementById('takePhotoBtn').addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', async () => {
    const file = photoInput.files[0];
    if(!file) return;
    try{
      currentPhoto = await resizeImageFile(file);
      photoPreview.innerHTML = `<img src="${currentPhoto}">`;
      removePhotoBtn.style.display = 'inline-block';
    }catch(e){ alert('Foto konnte nicht geladen werden.'); }
  });
  removePhotoBtn.addEventListener('click', () => {
    currentPhoto = null;
    photoInput.value = '';
    photoPreview.innerHTML = selectedEmoji;
    removePhotoBtn.style.display = 'none';
  });

  document.getElementById('addProduct').addEventListener('click', async () => {
    const name = document.getElementById('pname').value.trim();
    const price = parseFloat(document.getElementById('pprice').value);
    const code = document.getElementById('pcode').value.trim();
    if(!name || isNaN(price) || price < 0 || !code){
      alert('Bitte Name, Preis und QR-Nummer eingeben.');
      return;
    }
    if(products.some(p => p.code === code)){
      alert('Diese QR-Nummer wird schon für ein anderes Produkt verwendet.');
      return;
    }
    if(cards.some(c => c.code === code)){
      alert('Diese Nummer wird schon für eine Bankkarte verwendet. Bitte eine andere QR-Nummer wählen.');
      return;
    }
    products.push({ id: 'p_' + Date.now(), name, price, emoji: selectedEmoji, photo: currentPhoto, code });
    await saveProducts();
    currentPhoto = null;
    renderVerwaltung();
  });

  document.getElementById('addCard').addEventListener('click', async () => {
    const code = document.getElementById('cardCode').value.trim();
    const amount = parseFloat(document.getElementById('cardAmount').value);
    if(!code || isNaN(amount) || amount <= 0){
      alert('Bitte Karten-Nummer und einen positiven Betrag eingeben.');
      return;
    }
    if(products.some(p => p.code === code)){
      alert('Diese Nummer wird schon für ein Produkt verwendet. Bitte eine andere Nummer für die Karte wählen.');
      return;
    }
    const existing = cards.find(c => c.code === code);
    if(existing){ existing.balance = +(existing.balance + amount).toFixed(2); }
    else{ cards.push({ code, balance: +amount.toFixed(2) }); }
    await saveCards();
    document.getElementById('cardCode').value = '';
    document.getElementById('cardAmount').value = '';
    renderCardList();
    const cardTitles = app.querySelectorAll('.section-title');
    if(cardTitles[3]) cardTitles[3].textContent = `Bankkarten (${cards.length})`;
  });

  document.getElementById('resetRevenue').addEventListener('click', async () => {
    if(confirm('Kassenbericht wirklich auf 0 € zurücksetzen?')){
      totalRevenue = 0;
      await saveRevenue();
      document.getElementById('revenueDisplay').textContent = '0,00 €';
    }
  });

  renderProductList();
  renderCardList();
}

function renderProductList(){
  const list = document.getElementById('productList');
  if(!list) return;
  list.innerHTML = '';
  if(products.length === 0){
    list.innerHTML = '<p class="empty-hint">Noch keine Produkte. Füge oben eines hinzu!</p>';
    return;
  }
  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <button class="del-btn" data-id="${p.id}">✕</button>
      ${p.photo ? `<img class="photo" src="${p.photo}">` : `<div class="emoji">${p.emoji}</div>`}
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pprice">${p.price.toFixed(2)} €</div>
      <div class="pcode">QR: ${escapeHtml(p.code)}</div>
    `;
    list.appendChild(card);
  });
  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(confirm('Dieses Produkt wirklich löschen?')){
        products = products.filter(p => p.id !== btn.dataset.id);
        await saveProducts();
        renderProductList();
      }
    });
  });
}

function renderCardList(){
  const list = document.getElementById('cardList');
  if(!list) return;
  list.innerHTML = '';
  if(cards.length === 0){
    list.innerHTML = '<p class="empty-hint">Noch keine Bankkarten angelegt.</p>';
    return;
  }
  cards.forEach(c => {
    const row = document.createElement('div');
    row.className = 'cart-row';
    row.innerHTML = `
      <span class="emoji">💳</span>
      <span class="name">QR: ${escapeHtml(c.code)}</span>
      <span class="line-total">${c.balance.toFixed(2)} €</span>
      <button class="rm" data-code="${c.code}">🗑️</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('.rm').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(confirm('Diese Karte wirklich löschen?')){
        cards = cards.filter(c => c.code !== btn.dataset.code);
        await saveCards();
        renderCardList();
      }
    });
  });
}

/* ---------- EINKAUFSLISTE (SIMULATOR) ---------- */
function renderListe(){
  screenTitle.textContent = "🛒 Einkaufsliste";
  homeBtn.style.display = 'inline-block';
  settingsBtn.style.display = 'none';
  generateShoppingList();
}

function generateShoppingList(){
  if(products.length === 0){
    app.innerHTML = `<div class="card"><p class="empty-hint">Noch keine Produkte angelegt. Bitte zuerst im Verwaltungsbereich (⚙️) welche hinzufügen.</p></div>`;
    return;
  }
  const shuffled = [...products].sort(() => 0.5 - Math.random());
  const count = Math.min(7, shuffled.length);
  shoppingList = shuffled.slice(0, count).map(p => ({...p, done:false}));
  renderListeUI();
}

function renderListeUI(){
  const doneCount = shoppingList.filter(i => i.done).length;
  app.innerHTML = `
    <div class="card">
      <h3 class="section-title">Deine Einkaufsliste (${doneCount}/${shoppingList.length})</h3>
      <div id="listeItems"></div>
      <button class="print-btn" id="newListBtn" style="margin-top:14px;">🔄 Neue Liste</button>
      <button class="pay-btn" id="toKasseBtn" ${doneCount < shoppingList.length ? 'disabled' : ''}>🧾 Weiter zur Kasse</button>
    </div>
  `;
  const container = document.getElementById('listeItems');
  shoppingList.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'cart-row' + (item.done ? ' liste-done' : '');
    row.style.cursor = 'pointer';
    row.innerHTML = `
      ${item.photo ? `<img class="photo" src="${item.photo}">` : `<span class="emoji">${item.emoji}</span>`}
      <span class="name">${escapeHtml(item.name)}</span>
      <span>${item.done ? '✅' : '⭕'}</span>
    `;
    row.addEventListener('click', () => {
      shoppingList[idx].done = !shoppingList[idx].done;
      renderListeUI();
    });
    container.appendChild(row);
  });
  document.getElementById('newListBtn').addEventListener('click', generateShoppingList);
  const toKasseBtn = document.getElementById('toKasseBtn');
  if(toKasseBtn){
    toKasseBtn.addEventListener('click', () => {
      if(shoppingList.every(i => i.done)) renderKasse();
    });
  }
}

/* ---------- KASSE ---------- */
function renderKasse(){
  screenTitle.textContent = "🧾 Kasse";
  homeBtn.style.display = 'inline-block';
  settingsBtn.style.display = 'none';
  cart = [];
  app.innerHTML = `
    <button class="scan-btn" id="toggleScan">📷 Scannen starten</button>
    <div id="reader" style="display:none;"></div>
    <div class="scan-flash" id="scanFlash"></div>

    <div class="card">
      <h3 class="section-title">Warenkorb</h3>
      <div id="cartList"></div>
      <div class="total-row">
        <span>Gesamt</span>
        <span id="cartTotal">0,00 €</span>
      </div>
      <button class="pay-btn" id="payBtn" disabled>💶 Bar bezahlen</button>
      <button class="photo-btn" id="cardPayBtn" style="margin-top:10px;width:100%;">💳 Mit Karte bezahlen</button>
    </div>

    <div class="card">
      <h3 class="section-title">Oder von Hand hinzufügen</h3>
      <div class="manual-grid" id="manualGrid"></div>
    </div>
  `;

  document.getElementById('toggleScan').addEventListener('click', toggleScan);
  document.getElementById('payBtn').addEventListener('click', openPayModal);
  document.getElementById('cardPayBtn').addEventListener('click', () => startScanIfNeeded('📷 Bankkarte vor die Kamera halten...'));

  const grid = document.getElementById('manualGrid');
  if(products.length === 0){
    grid.innerHTML = '<p class="empty-hint">Noch keine Produkte angelegt.</p>';
  }else{
    products.forEach(p => {
      const item = document.createElement('div');
      item.className = 'manual-item';
      item.innerHTML = `${p.photo ? `<img class="photo" src="${p.photo}">` : `<span class="emoji">${p.emoji}</span>`}${escapeHtml(p.name)}<br>${p.price.toFixed(2)} €`;
      item.addEventListener('click', () => addToCart(p));
      grid.appendChild(item);
    });
  }

  renderCart();
}

async function toggleScan(){
  const readerDiv = document.getElementById('reader');
  const btn = document.getElementById('toggleScan');
  const flash = document.getElementById('scanFlash');

  if(scanLoopActive){
    await stopScanner();
    readerDiv.style.display = 'none';
    readerDiv.innerHTML = '';
    btn.textContent = '📷 Scannen starten';
    return;
  }

  if(!('BarcodeDetector' in window)){
    if(flash) flash.textContent = 'Dieses Gerät unterstützt die eingebaute QR-Erkennung leider nicht. Bitte "Android System WebView" im Play Store aktualisieren, oder Produkte von Hand hinzufügen.';
    return;
  }

  readerDiv.style.display = 'block';
  btn.textContent = '⏹️ Scannen stoppen';

  try{
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    scanVideo = document.createElement('video');
    scanVideo.setAttribute('playsinline', '');
    scanVideo.muted = true;
    scanVideo.autoplay = true;
    readerDiv.innerHTML = '';
    readerDiv.appendChild(scanVideo);
    scanVideo.srcObject = scanStream;
    await scanVideo.play();

    scanLoopActive = true;
    activeCode = null;
    lastSeenTime = 0;

    const loop = async () => {
      if(!scanLoopActive) return;
      if(scanVideo && scanVideo.readyState >= 2){
        try{
          const results = await detector.detect(scanVideo);
          const now = Date.now();
          if(results.length > 0){
            lastSeenTime = now;
            const text = results[0].rawValue;
            // Nur auslösen, wenn sich der erkannte Code geändert hat -
            // solange derselbe Code im Bild bleibt, passiert nichts weiter.
            if(text !== activeCode){
              activeCode = text;
              handleScannedCode(text);
            }
          }else if(activeCode && now - lastSeenTime > 600){
            // Kein Code mehr seit 600ms im Bild -> Code gilt als "entfernt",
            // ein erneutes Zeigen (auch desselben Codes) darf wieder auslösen.
            activeCode = null;
          }
        }catch(e){ /* einzelner Frame fehlgeschlagen, einfach weiterversuchen */ }
      }
      if(scanLoopActive) requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);

  }catch(e){
    if(flash) flash.textContent = 'Kamera konnte nicht gestartet werden.';
    btn.textContent = '📷 Scannen starten';
    scanLoopActive = false;
    readerDiv.style.display = 'none';
  }
}

function handleScannedCode(decodedText){
  const card = cards.find(c => c.code === decodedText);
  if(card){
    attemptCardPayment(decodedText);
    return;
  }

  const flash = document.getElementById('scanFlash');
  const product = products.find(p => p.code === decodedText);
  if(product){
    beep(880, 0.1);
    addToCart(product);
    if(flash){ flash.textContent = `✅ ${product.emoji || '📦'} ${product.name} hinzugefügt`; setTimeout(()=>flash.textContent='',1800); }
  }else{
    beep(220, 0.2);
    if(flash){ flash.textContent = `❓ Unbekannter Code: ${decodedText}`; setTimeout(()=>flash.textContent='',1800); }
  }
}

function addToCart(product){
  const existing = cart.find(c => c.productId === product.id);
  if(existing){ existing.qty += 1; }
  else{ cart.push({productId: product.id, name: product.name, price: product.price, emoji: product.emoji, photo: product.photo, qty: 1}); }
  renderCart();
}

function renderCart(){
  const list = document.getElementById('cartList');
  const totalEl = document.getElementById('cartTotal');
  const payBtn = document.getElementById('payBtn');
  if(!list) return;
  list.innerHTML = '';
  if(cart.length === 0){
    list.innerHTML = '<p class="empty-hint">Noch nichts im Warenkorb. Scanne ein Produkt!</p>';
  }
  cart.forEach((c, idx) => {
    const lineTotal = c.price * c.qty;
    const row = document.createElement('div');
    row.className = 'cart-row';
    row.innerHTML = `
      ${c.photo ? `<img class="photo" src="${c.photo}">` : `<span class="emoji">${c.emoji}</span>`}
      <span class="name">${escapeHtml(c.name)}</span>
      <span class="qty">×${c.qty}</span>
      <span class="line-total">${lineTotal.toFixed(2)} €</span>
      <button class="rm" data-idx="${idx}">🗑️</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('.rm').forEach(btn => {
    btn.addEventListener('click', () => {
      cart.splice(parseInt(btn.dataset.idx,10), 1);
      renderCart();
    });
  });
  const total = getCartTotal();
  totalEl.textContent = total.toFixed(2).replace('.', ',') + ' €';
  payBtn.disabled = cart.length === 0;
}

function openPayModal(){
  const total = getCartTotal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h2>💶 Bar bezahlen</h2>
      <p>Zu zahlen: <strong>${total.toFixed(2).replace('.', ',')} €</strong></p>
      <input type="number" step="0.01" min="0" id="paidInput" placeholder="Gegeben (€)">
      <div class="change-display" id="changeDisplay"></div>
      <div class="modal-actions">
        <button class="cancel" id="cancelPay">Abbrechen</button>
        <button class="confirm" id="confirmPay">Fertig ✅</button>
      </div>
    </div>
  `;
  document.body.appendChild(bg);
  const input = document.getElementById('paidInput');
  const changeDisplay = document.getElementById('changeDisplay');
  input.addEventListener('input', () => {
    const paid = parseFloat(input.value);
    if(isNaN(paid)){ changeDisplay.textContent=''; return; }
    const change = paid - total;
    changeDisplay.textContent = change >= 0
      ? `Rückgeld: ${change.toFixed(2).replace('.', ',')} €`
      : `Es fehlen noch ${Math.abs(change).toFixed(2).replace('.', ',')} €`;
  });
  document.getElementById('cancelPay').addEventListener('click', () => bg.remove());
  document.getElementById('confirmPay').addEventListener('click', async () => {
    bg.remove();
    cart = [];
    renderCart();
    totalRevenue += total;
    await saveRevenue();
    const flash = document.getElementById('scanFlash');
    if(flash){ flash.textContent = '🎉 Kauf abgeschlossen! Nächster Kunde bitte.'; setTimeout(()=>flash.textContent='',2500); }
  });
  input.focus();
}

async function attemptCardPayment(code){
  const flash = document.getElementById('scanFlash');
  const card = cards.find(c => c.code === code);
  if(!card){
    if(flash){ flash.textContent = `❓ Unbekannter Karten-Code: ${code}`; setTimeout(()=>flash.textContent='',1800); }
    return;
  }
  const total = getCartTotal();
  if(cart.length === 0 || total <= 0){
    beep(220, 0.2);
    if(flash){ flash.textContent = 'Warenkorb ist leer – nichts zu bezahlen.'; setTimeout(()=>flash.textContent='',1800); }
    return;
  }
  if(card.balance >= total){
    const oldBalance = card.balance;
    card.balance = +(card.balance - total).toFixed(2);
    await saveCards();
    beep(880, 0.15);
    cart = [];
    renderCart();
    totalRevenue += total;
    await saveRevenue();
    showPaymentSuccessModal(oldBalance, total, card.balance);
    if(flash){ flash.textContent = '🎉 Mit Karte bezahlt! Nächster Kunde bitte.'; setTimeout(()=>flash.textContent='',2500); }
  }else{
    beep(220, 0.25);
    showPaymentFailModal(total, card.balance);
  }
}

function showPaymentSuccessModal(oldBalance, paid, newBalance){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h2>💳 Bezahlt!</h2>
      <div class="change-display">- ${paid.toFixed(2).replace('.', ',')} €</div>
      <div style="display:flex;justify-content:space-between;margin:14px 0 6px;font-weight:700;color:var(--brown-dark);">
        <span>Altes Guthaben</span><span>${oldBalance.toFixed(2).replace('.', ',')} €</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:14px;font-weight:800;font-size:1.3rem;color:var(--green-dark);">
        <span>Neues Guthaben</span><span>${newBalance.toFixed(2).replace('.', ',')} €</span>
      </div>
      <div class="modal-actions">
        <button class="confirm" id="closePayModal">Weiter</button>
      </div>
    </div>
  `;
  document.body.appendChild(bg);
  document.getElementById('closePayModal').addEventListener('click', () => bg.remove());
}

function showPaymentFailModal(total, balance){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h2>❌ Nicht genug Guthaben</h2>
      <div style="display:flex;justify-content:space-between;margin:14px 0 6px;font-weight:700;color:var(--brown-dark);">
        <span>Einkauf kostet</span><span>${total.toFixed(2).replace('.', ',')} €</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:14px;font-weight:800;color:var(--red-dark);">
        <span>Karte hat nur</span><span>${balance.toFixed(2).replace('.', ',')} €</span>
      </div>
      <div class="modal-actions">
        <button class="cancel" id="closeFailModal">Schließen</button>
      </div>
    </div>
  `;
  document.body.appendChild(bg);
  document.getElementById('closeFailModal').addEventListener('click', () => bg.remove());
}

async function startScanIfNeeded(hintText){
  const flash = document.getElementById('scanFlash');
  if(!scanLoopActive){
    await toggleScan();
  }
  if(flash && hintText) flash.textContent = hintText;
}

(async function init(){
  await loadProducts();
  await loadCards();
  await loadRevenue();
  goHome();
})();
</script>
